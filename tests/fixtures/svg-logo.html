<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Veil SVG-Logo-Testseite</title>
    <script src="/waechter.js"></script>
    <style>
      body { margin: 0; padding: 8px; font-family: sans-serif; }
      #kopf { display: flex; gap: 16px; align-items: center; height: 56px; }
      #kopf img { display: block; }
      #logo, #logo-viewbox, #logo-data { width: 150px; height: 40px; }
      #logo-raster { width: 200px; height: 200px; display: block; }
      #hg { width: 150px; height: 40px; background-repeat: no-repeat; background-size: contain; }
    </style>
  </head>
  <body>
    <!-- SVG-Logos wie auf den Erwachsenenseiten: vom Bilderserver eines fremden Ursprungs (Parameter svg=<Ursprung>, Standard Port plus 2, ohne
         CORS), Typ image/svg+xml. Die Seite selbst enthaelt keine Rasterbilder. -->
    <div id="kopf"></div>
    <div id="zeile"></div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var basis = q.get('svg') || 'http://127.0.0.1:' + (Number(location.port) + 1);
        var kopf = document.getElementById('kopf');
        function bild(id, src, ziel) {
          var b = document.createElement('img');
          b.id = id;
          b.alt = id;
          b.src = src;
          (ziel || kopf).appendChild(b);
          return b;
        }
        // 1: Vektor-Logo mit width/height im Dokument (150 x 40), 2: nur viewBox (keine Eigengroesse), 3: Data-URL.
        bild('logo', basis + '/logo.svg');
        bild('logo-viewbox', basis + '/logo-viewbox.svg');
        bild('logo-data', 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40"><rect width="150" height="40" fill="#e91e63"/></svg>'));
        // 4: Hintergrund-SVG (Inline-Stil).
        var hg = document.createElement('div');
        hg.id = 'hg';
        hg.style.backgroundImage = 'url(' + basis + '/logo.svg)';
        kopf.appendChild(hg);
        // 5: SVG mit eingebettetem Rasterbild (Parameter raster=1): muss geprueft werden, nie blind frei.
        if (q.get('raster')) bild('logo-raster', basis + '/raster.svg', document.getElementById('zeile'));
        // 7: SVG mit Bewegung oder Skript (Parameter animiert=1): wird nie freigegeben, bleibt verdeckt.
        if (q.get('animiert')) {
          bild('logo-smil', basis + '/smil.svg');
          bild('logo-css', basis + '/css-animiert.svg');
          bild('logo-skript', basis + '/skript.svg');
          bild('logo-fo', basis + '/fremdobjekt.svg');
        }
        // 8: SVG auf dem Canvas-Weg (Parameter lesbar=1, Lesung 17 R2-1): data:, blob: und gleicher Ursprung. Bewegte SVG bleiben verdeckt,
        // ruhige werden frei. Ein Hintergrund mit bewegtem data:-SVG ebenso.
        if (q.get('lesbar')) {
          var zeile = document.getElementById('zeile');
          var smil = '<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40"><rect width="150" height="40" fill="#e91e63"><set attributeName="fill" to="#000" begin="1s"/></rect></svg>';
          var ruhig = '<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40"><rect width="150" height="40" fill="#e91e63"/></svg>';
          bild('lesbar-smil-data', 'data:image/svg+xml;utf8,' + encodeURIComponent(smil), zeile);
          bild('lesbar-smil-blob', URL.createObjectURL(new Blob([smil], { type: 'image/svg+xml' })), zeile);
          bild('lesbar-smil-gleich', '/smil.svg', zeile);
          bild('lesbar-ruhig-blob', URL.createObjectURL(new Blob([ruhig], { type: 'image/svg+xml' })), zeile);
          bild('lesbar-ruhig-gleich', '/statisch.svg', zeile);
          var hgs = document.createElement('div');
          hgs.id = 'lesbar-hg-smil';
          hgs.style.cssText = 'width:150px;height:40px;background-repeat:no-repeat';
          hgs.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(smil) + '")';
          zeile.appendChild(hgs);
          // Rasterbild hinter einer blob:-Adresse, die die Seite nach dem Laden widerruft (Pruefung Runde 3, N1): muss beurteilt werden.
          var leinwand = document.createElement('canvas');
          leinwand.width = 150;
          leinwand.height = 40;
          var c = leinwand.getContext('2d');
          c.fillStyle = '#e91e63';
          c.fillRect(0, 0, 150, 40);
          leinwand.toBlob(function (b) {
            var w = document.createElement('img');
            w.id = 'lesbar-raster-widerrufen';
            w.alt = w.id;
            w.onload = function () { URL.revokeObjectURL(w.src); };
            w.src = URL.createObjectURL(b);
            zeile.appendChild(w);
          }, 'image/png');
        }
        // 6: SVG, das nicht ladbar ist (404): kein Urteil darf ewig offen bleiben.
        if (q.get('kaputt')) bild('logo-kaputt', basis + '/gibt-es-nicht.svg');
      })();
    </script>
  </body>
</html>
