<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fremde Dialoge ueber der Werbung (synthetisch, K3)</title>
    <style>
      body { margin: 0; font-family: sans-serif; min-height: 2000px; }
      #kopf { height: 40px; background: #123; color: #fff; }
      #a-oben { display: block; width: 970px; height: 250px; margin: 20px auto 0; background: #cde; }
      #a-neben { display: block; width: 300px; height: 250px; margin: 20px 0 0 8px; background: #dec; }
      #a-eigen { display: block; width: 300px; height: 250px; margin: 20px 0 0 8px; background: #edc; }
      /* Cookie-Dialog der Seite: fest, hoechster z-index, mit weissem Grund (wie bei chip.de, Sourcepoint) */
      #cookie-huelle { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 2147483647; background: rgba(0, 0, 0, 0.5); }
      #cookie { position: absolute; left: 200px; top: 0; width: 880px; height: 700px; background: #fff; color: #000; font-size: 18px; }
      #modal-dialog { width: 900px; height: 500px; padding: 0; border: 2px solid #000; background: #fff; color: #000; }
      #huelle-app { position: relative; z-index: 0; }
      #drin-dialog { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; background: rgba(0, 0, 0, 0.5); }
      #drin-box { position: absolute; left: 200px; top: 60px; width: 880px; height: 500px; background: #fff; color: #000; }
      #skin { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: -1; background: #ffe; }
    </style>
  </head>
  <body>
    <div id="kopf">Page header</div>
    <div id="huelle-app">
      <ins class="adsbygoogle" id="a-oben" data-ad-client="ca-pub-0"></ins>
      <ins class="adsbygoogle" id="a-neben" data-ad-client="ca-pub-0"></ins>
      <div id="drin-dialog" role="dialog" aria-modal="true"><div id="drin-box"><p>Wrapped consent dialog</p></div></div>
    </div>
    <ins class="adsbygoogle" id="a-eigen" data-ad-client="ca-pub-0"></ins>
    <div id="cookie-huelle"><div id="cookie" role="dialog" aria-modal="true"><h2>We value your privacy</h2><p>Consent text of the page</p></div></div>
    <div id="skin"></div>
    <dialog id="modal-dialog"><h2>Native modal</h2><p>Consent text in a top layer dialog</p></dialog>
    <script>
      // Sperre des Seiten-Rollens wie bei vielen Einwilligungs-Dialogen: body wird fest (und damit eine eigene Stapelebene)
      window.oeffneCookie = (an) => {
        document.getElementById('cookie-huelle').style.display = an ? 'block' : 'none';
        document.body.style.position = an ? 'fixed' : '';
        document.body.style.width = an ? '100%' : '';
        document.body.style.top = an ? '0' : '';
      };
      window.oeffneModal = (an) => {
        const d = document.getElementById('modal-dialog');
        if (an && !d.open) d.showModal();
        if (!an && d.open) d.close();
      };
      window.zeigeSkin = (an) => (document.getElementById('skin').style.display = an ? 'block' : 'none');
      // Rollsperre wie bei vielen Seiten: body fest, mit negativem top um die gerollte Strecke
      window.rollSperre = (an) => {
        const b = document.body;
        if (an) {
          const y = window.scrollY;
          b.style.position = 'fixed';
          b.style.width = '100%';
          b.style.top = -y + 'px';
        } else {
          const y = -parseFloat(b.style.top || '0');
          b.style.position = '';
          b.style.width = '';
          b.style.top = '';
          window.scrollTo(0, y);
        }
      };
      window.oeffneDrin = (an) => (document.getElementById('drin-dialog').style.display = an ? 'block' : 'none');
    </script>
  </body>
</html>
