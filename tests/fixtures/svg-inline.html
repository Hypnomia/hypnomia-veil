<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Veil Inline-SVG-Testseite</title>
    <script src="/waechter.js"></script>
    <script>
      // Eigener Waechter fuer Bilder in Inline-SVG (<svg><image>), Paket N1 der Nacht 18: waechter.js kennt nur img, video, canvas und
      // Inline-Hintergruende. Nach dem Zeichnen jedes Frames (rAF, dann setTimeout) wird jedes SVG-image im Dokument und in offenen Shadow Roots
      // geprueft: ohne Urteil (data-veil) muss es opacity 0 haben, sonst hat man es ungeprueft gesehen.
      //   window.__svgAufblitzen   SVG-Bilder, die ohne Urteil sichtbar waren; window.__svgWer: welche (Kennung und Zeit)
      //   window.__svgProben       Anzahl der Proben
      // Waehrend die Seite aus ist (data-veil-seite="aus": Pause, Ausnahme) wird nicht geprueft.
      (function () {
        window.__svgAufblitzen = 0;
        window.__svgProben = 0;
        window.__svgWer = [];
        function sammle(wurzel, aus) {
          var liste = wurzel.querySelectorAll('*');
          for (var i = 0; i < liste.length; i++) if (liste[i].shadowRoot) sammle(liste[i].shadowRoot, aus);
          var bilder = wurzel.querySelectorAll('image');
          for (var j = 0; j < bilder.length; j++) if (bilder[j].namespaceURI === 'http://www.w3.org/2000/svg') aus.push(bilder[j]);
        }
        function probe() {
          var html = document.documentElement;
          if (!html || html.getAttribute('data-veil-seite') === 'aus') return;
          var bilder = [];
          sammle(document, bilder);
          for (var i = 0; i < bilder.length; i++) {
            var el = bilder[i];
            window.__svgProben++;
            if (el.getAttribute('data-veil') === null && getComputedStyle(el).opacity !== '0') {
              window.__svgAufblitzen++;
              if (window.__svgWer.length < 50) window.__svgWer.push((el.id || 'image') + ' @' + Math.round(performance.now()));
            }
          }
        }
        function schritt() {
          setTimeout(probe, 0);
          requestAnimationFrame(schritt);
        }
        requestAnimationFrame(schritt);
        // Pixelprobe im Augenblick des Urteils "zensiert" (Mikrotask nach dem Setzen, vor dem naechsten Zeichnen): was zeigt das Element da?
        // window.__svgZensurProbe[id] = 64 x 64 RGBA als Liste, oder 'verschmutzt' (das Element zeigte noch ein fremdes Original).
        window.__svgZensurProbe = {};
        function probeZensur(el) {
          var k = document.createElement('canvas');
          k.width = 64;
          k.height = 64;
          var x = k.getContext('2d');
          try {
            x.drawImage(el, 0, 0, 64, 64);
            window.__svgZensurProbe[el.id] = Array.from(x.getImageData(0, 0, 64, 64).data);
          } catch (e) {
            window.__svgZensurProbe[el.id] = 'verschmutzt';
          }
        }
        var zensurBeobachter = new MutationObserver(function (liste) {
          liste.forEach(function (m) {
            if (m.target.localName === 'image' && m.target.getAttribute('data-veil') === 'zensiert') probeZensur(m.target);
          });
        });
        window.__svgBeobachte = function (wurzel) {
          zensurBeobachter.observe(wurzel, { subtree: true, attributes: true, attributeFilter: ['data-veil'] });
        };
        window.__svgBeobachte(document);
      })();
    </script>
    <style>
      body { margin: 0; padding: 8px; font-family: sans-serif; }
      .reihe { display: flex; flex-wrap: wrap; gap: 8px; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <!-- Bilder in Inline-SVG: href, xlink:href, fremder Ursprung, data:, blob:, offene Shadow Root, harmloses Bild. Die Testbilder kommen vom
         Testserver aus ../05 Testbilder (nie im Repo). Kennungen: i-href, i-xlink, i-fremd, i-data, i-blob, i-shadow (in #wirt), i-sfw, i-sfw-xlink.
         Umgehungsversuche (duerfen nie frei werden): i-smil (set als Kind wechselt href nach 1,5 s), i-smil-fern (set an anderer Stelle zielt per
         xlink:href="#..." auf das Bild und wechselt xlink:href), i-blob-weg (blob:-Adresse sofort nach dem Setzen widerrufen).
         html-image: ein HTML-Element namens image (createElement), kein Bild: es muss sichtbar bleiben. -->
    <div class="reihe" id="reihe">
      <svg width="200" height="200"><image id="i-href" width="200" height="200" href="/testbild/nsfw/IMG_0260.jpg" /></svg>
      <svg width="200" height="200" xmlns:xlink="http://www.w3.org/1999/xlink"><image id="i-xlink" width="200" height="200" xlink:href="/testbild/nsfw/IMG_0260.jpg" /></svg>
      <svg width="200" height="200"><image id="i-sfw" width="200" height="200" href="/synthetisch/1.png" /></svg>
      <svg width="200" height="200" xmlns:xlink="http://www.w3.org/1999/xlink"><image id="i-sfw-xlink" width="200" height="200" xlink:href="/synthetisch/2.png" /></svg>
      <svg width="200" height="200"><image id="i-smil" width="200" height="200" href="/synthetisch/5.png"><set attributeName="href" to="/testbild/nsfw/IMG_0260.jpg" begin="1.5s" fill="freeze" /></image></svg>
      <svg width="200" height="200" xmlns:xlink="http://www.w3.org/1999/xlink">
        <image id="i-smil-fern" width="200" height="200" xlink:href="/synthetisch/6.png" />
        <set xlink:href="#i-smil-fern" attributeName="xlink:href" to="/testbild/nsfw/IMG_0260.jpg" begin="1.5s" fill="freeze" />
      </svg>
      <div id="wirt"></div>
    </div>
    <script>
      (function () {
        var SVG = 'http://www.w3.org/2000/svg';
        var reihe = document.getElementById('reihe');
        // Fremder Ursprung: derselbe Testserver auf Port plus 2 (wie die anderen Testseiten), ohne CORS.
        var fremd = 'http://127.0.0.1:' + (Number(location.port) + 2);
        // Originale Quellen je Kennung (die Tests vergleichen nach der Pause damit).
        window.__svgQuellen = {
          'i-href': '/testbild/nsfw/IMG_0260.jpg',
          'i-xlink': '/testbild/nsfw/IMG_0260.jpg',
          'i-sfw': '/synthetisch/1.png',
          'i-sfw-xlink': '/synthetisch/2.png',
          'i-smil': '/synthetisch/5.png',
          'i-smil-fern': '/synthetisch/6.png',
        };
        // HTML-Element namens image (kein Bild, HTMLUnknownElement): darf von der Versteck-Regel nicht getroffen werden.
        var htmlImage = document.createElement('image');
        htmlImage.id = 'html-image';
        htmlImage.textContent = 'kein Bild';
        htmlImage.style.display = 'block';
        document.body.appendChild(htmlImage);
        function svgMit(id, href) {
          var svg = document.createElementNS(SVG, 'svg');
          svg.setAttribute('width', '200');
          svg.setAttribute('height', '200');
          var bild = document.createElementNS(SVG, 'image');
          bild.id = id;
          bild.setAttribute('width', '200');
          bild.setAttribute('height', '200');
          bild.setAttribute('href', href);
          window.__svgQuellen[id] = href;
          svg.appendChild(bild);
          return svg;
        }
        reihe.appendChild(svgMit('i-fremd', fremd + '/testbild/nsfw/IMG_0260.jpg'));
        // Offene Shadow Root mit einem SVG-Bild.
        var wurzel = document.getElementById('wirt').attachShadow({ mode: 'open' });
        window.__svgBeobachte(wurzel);
        wurzel.appendChild(svgMit('i-shadow', '/testbild/nsfw/IMG_0260.jpg'));
        // data: und blob: aus demselben Testbild.
        fetch('/testbild/nsfw/IMG_0260.jpg')
          .then(function (r) { return r.blob(); })
          .then(function (b) {
            reihe.appendChild(svgMit('i-blob', URL.createObjectURL(b)));
            // Sofort widerrufen (verbreitetes Muster): der Abruf des Browsers ist angestossen, spaeter lesen kann niemand mehr.
            var weg = svgMit('i-blob-weg', URL.createObjectURL(b));
            reihe.appendChild(weg);
            URL.revokeObjectURL(weg.firstChild.getAttribute('href'));
            return new Promise(function (fertig) {
              var leser = new FileReader();
              leser.onload = function () { fertig(leser.result); };
              leser.readAsDataURL(b);
            });
          })
          .then(function (daten) {
            reihe.appendChild(svgMit('i-data', daten));
            document.documentElement.dataset.svgBereit = '1';
          });
      })();
    </script>
  </body>
</html>
