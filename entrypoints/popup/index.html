<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYPNOMIA VEIL</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>HYPNOMIA VEIL</h1>
        <p id="status" role="status" aria-live="polite"></p>
      </header>

      <button id="pause" class="gross" type="button"></button>

      <section aria-labelledby="stimmung-titel">
        <div class="kopf">
          <h2 id="stimmung-titel">Mia's mood</h2>
          <output id="stimmung-wert" for="stimmung"></output>
        </div>
        <input id="stimmung" type="range" min="0.10" max="0.25" step="0.01" aria-labelledby="stimmung-titel" />
        <div class="enden"><span>Suspicious</span><span>Relaxed</span></div>
        <p class="hinweis">When I'm suspicious, I cover more. When I'm relaxed, borderline pictures get through.</p>
      </section>

      <section aria-labelledby="stil-titel">
        <h2 id="stil-titel">Cover style</h2>
        <div class="wahl" role="radiogroup" aria-labelledby="stil-titel">
          <label><input type="radio" name="stil" value="mosaik" /><span>Mosaic</span></label>
          <label><input type="radio" name="stil" value="blur" /><span>Blur</span></label>
          <label><input type="radio" name="stil" value="mia-patch" /><span>Mia patch</span></label>
        </div>
        <p id="pack-hinweis" class="hinweis"></p>
        <button id="pack-link" class="klein" type="button">Mia Pack</button>
      </section>

      <section>
        <label class="schalter">
          <input id="strict" type="checkbox" role="switch" />
          <span class="regler" aria-hidden="true"></span>
          <span class="text"><strong>Strict</strong><small>hide each page until Mia has checked it (a little slower)</small></span>
        </label>
      </section>

      <section aria-labelledby="zonen-titel">
        <h2 id="zonen-titel">What I cover</h2>
        <ul id="zonen" class="zonen"></ul>
        <p class="hinweis">Tick "even when clothed" and I cover it under clothing too.</p>
      </section>

      <section>
        <button id="ausnahme" class="klein" type="button"></button>
        <p id="ausnahme-hinweis" class="hinweis"></p>
      </section>

      <footer>
        <span id="version"></span>
        <span>Pausing and uninstalling are always allowed.</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
