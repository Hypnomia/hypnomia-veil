<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <meta name="referrer" content="no-referrer" />
    <title>HYPNOMIA VEIL: Mia</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>HYPNOMIA VEIL</h1>
      </header>

      <section class="kopf" aria-labelledby="titel">
        <div id="chibi" class="chibi" hidden><img id="chibi-bild" alt="" /></div>
        <div>
          <h2 id="titel">I'll take it from here, pet.</h2>
          <p id="ziel-zeile" class="leise" hidden></p>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section aria-labelledby="bilder-titel">
        <h2 id="bilder-titel" class="klein-titel">Look at me instead</h2>
        <div id="bilder" class="bilder"></div>
        <p id="bilder-leer" class="leise" hidden>No pictures to show right now.</p>
      </section>

      <section class="links" aria-labelledby="links-titel">
        <h2 id="links-titel" class="klein-titel">Find me properly</h2>
        <p>
          <a id="link-patreon" class="knopf" target="_blank" rel="noopener noreferrer">Patreon</a>
          <a id="link-subscribestar" class="knopf" target="_blank" rel="noopener noreferrer">SubscribeStar</a>
        </p>
      </section>

      <footer>
        <button id="pause" type="button" class="pause">Pause Mia</button>
        <span>Pausing is always allowed. It takes you straight back.</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
